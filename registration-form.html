<!DOCTYPE html>
<html lang="hi">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>समाज पंजीकरण फॉर्म</title>

    <style>
        *{
          margin:0;
          padding:0;
          box-sizing:border-box;
          font-family:Arial,sans-serif;
        }
    
        body{
          background:#02151c;
          color:white;
        }
    
        .main-header{
          width:100%;
          padding:70px 20px;
          text-align:center;
          background:linear-gradient(
            135deg,
            #0d5d73,
            #2b8aa0,
            #5aa7b5
          );
        }
    
        .tagline{
          display:inline-block;
          border:1px solid rgba(255,255,255,0.5);
          padding:10px 25px;
          border-radius:30px;
          font-size:20px;
          margin-bottom:25px;
          background:rgba(255,255,255,0.08);
        }
    
        .main-header h1{
          font-size:48px;
          margin-bottom:20px;
          line-height:1.3;
        }
    
        .line{
          width:120px;
          height:5px;
          background:#ffd54f;
          margin:0 auto 20px;
          border-radius:10px;
        }
    
        .main-header p{
          font-size:28px;
        }
    
        .wrapper{
          padding:40px 20px;
          display:flex;
          justify-content:center;
        }
    
        .container{
          width:100%;
          max-width:1200px;
          background:#06212a;
          border:1px solid #0f738f;
          border-radius:20px;
          padding:35px;
        }
    
        .container h2{
          text-align:center;
          margin-bottom:30px;
          font-size:34px;
        }
    
        .form-grid{
          display:grid;
          grid-template-columns:1fr 1fr;
          gap:25px;
        }
    
        .input-box{
          display:flex;
          flex-direction:column;
        }
    
        label{
          margin-bottom:10px;
          font-size:19px;
          color:#d6d6d6;
        }
    
        input,
        select,
        textarea{
          width:100%;
          max-width:100%;
          padding:15px;
          border:1px solid #163a47;
          border-radius:12px;
          background:#0d3441;
          color:white;
          font-size:16px;
          outline:none;
        }
    
        input:focus,
        select:focus,
        textarea:focus{
          border-color:#1aa6c2;
        }
    
        textarea{
          resize:none;
        }
    
        .full-width{
          grid-column:span 2;
        }
    
        button{
          width:100%;
          padding:18px;
          border:none;
          border-radius:14px;
          background:#0f738f;
          color:white;
          font-size:22px;
          cursor:pointer;
          transition:0.3s;
        }
    
        button:hover{
          background:#1694b5;
        }
    
        button:disabled{
          opacity:0.7;
          cursor:not-allowed;
        }
    
        /* =========================
           LOADING OVERLAY
        ========================= */
    
        #loadingOverlay{
          position:fixed;
          top:0;
          left:0;
          width:100%;
          height:100%;
          background:rgba(0,0,0,0.75);
          display:none;
          justify-content:center;
          align-items:center;
          z-index:99999;
        }
    
        .loader-box{
          background:#06212a;
          padding:40px;
          border-radius:20px;
          text-align:center;
          width:320px;
          border:2px solid #0f738f;
        }
    
        .loader-box h3{
          margin-top:20px;
          font-size:24px;
          color:white;
        }
    
        .loader-box p{
          margin-top:10px;
          color:#d6d6d6;
        }
    
        .spinner{
          width:70px;
          height:70px;
          border:7px solid #1c4b57;
          border-top:7px solid #ffd54f;
          border-radius:50%;
          animation:spin 1s linear infinite;
          margin:auto;
        }
    
        @keyframes spin{
          100%{
            transform:rotate(360deg);
          }
        }
    
        @media(max-width:768px){
    
          .wrapper{
            padding:24px 12px;
          }
    
          .form-grid{
            grid-template-columns:1fr;
          }
    
          .full-width{
            grid-column:span 1;
          }
    
          .main-header{
            padding:50px 15px;
          }
    
          .main-header h1{
            font-size:26px;
          }
    
          .main-header p{
            font-size:18px;
          }
    
          .container{
            padding:20px;
          }
    
        }
    
        @media(max-width:420px){
    
          .wrapper{
            padding:16px 8px;
          }
    
          .container{
            padding:15px;
          }
    
          .main-header h1{
            font-size:21px;
          }
    
          input,
          select,
          textarea{
            padding:12px;
            font-size:15px;
          }
    
        }
    </style>

          // =========================

          async function generateCard(){
        
            try{

              const requiredFields = [

                { id: "motherName", name: "माता का नाम" },
                { id: "gotra", name: "गोत्र" },
                { id: "nativePlace", name: "मूल निवासी" },
                { id: "age", name: "आयु" },

                { id: "contact1", name: "मोबाइल नंबर" },
                { id: "aadhaarNumber", name: "आधार नंबर" }
        
              ];
        
              for (let field of requiredFields) {
        
                let el = document.getElementById(field.id);
        
                if (!el.value || el.value.trim() === "") {
        
                  alert("❌ यह फील्ड अनिवार्य है: " + field.name);
        
                  document.getElementById("loadingOverlay").style.display = "none";
        
                  document.getElementById("submitBtn").disabled = false;
        
                  document.getElementById("submitBtn").innerText =
                    "जमा करें";
        
                  el.focus();
        
                  return;
        
                }
        
              }
        
              let ikaiValue =
                document.getElementById("ikaiName").value;
        
              if(ikaiValue === "Others"){
        
                ikaiValue =
                  document.getElementById("otherCity").value;
        
              }
        
              let ikaiNumber =
                ikaiNumbers[ikaiValue] || "999";
        
              // =========================
              // PHOTO BASE64
              // =========================
        
              let photoBase64 = "";
        
              const file =
                document.getElementById("photo").files[0];
        
              if(file){
        
                photoBase64 =
                  await convertToBase64(file);
        
              }
        
              // =========================
              // DATA OBJECT
              // =========================
        
              let memberData = {
        
                ikaiCode:
                  ikaiNumber,
        
                fullName:
                  document.getElementById("fullName").value,
        
                fatherName:
                  document.getElementById("fatherName").value,
        
                motherName:
                  document.getElementById("motherName").value,
        
                gotra:
                  document.getElementById("gotra").value,
        
                nativePlace:
                  document.getElementById("nativePlace").value,
        
                age:
                  document.getElementById("age").value,
        
                maritalStatus:
                  document.getElementById("maritalStatus").value,
        
                profession:
                  document.getElementById("profession").value,
        
                education:
                  document.getElementById("education").value,
        
                bloodGroup:
                  document.getElementById("bloodGroup").value,
        
                ikaiName:
                  ikaiValue,
                
                ikaiCountry:
                  document.getElementById("countryName").value,
        
                district:
                  document.getElementById("district").value,
        
                pinCode:
                  document.getElementById("pinCode").value,
        
                contact1:
                  document.getElementById("contact1").value,
        
                aadhaarNumber:
                  document.getElementById("aadhaarNumber").value,
        
                permanentAddress:
                  document.getElementById("permanentAddress").value,
        
                currentAddress:
                  document.getElementById("currentAddress").value,
        
                photo:
                  photoBase64
        
              };
        
              // =========================
              // SAVE TO GOOGLE SHEET
              // =========================
        
              const response = await fetch(
                SCRIPT_URL,
                {
        
                  method: "POST",
        
                  headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                  },
        
                  body: JSON.stringify(memberData)
        
                }
              );
        
              const result =
                await response.json();
        
              // =========================
              // SUCCESS
              // =========================
        
              if(result.status === "success"){
        
                const memberId = result.memberId;
        
                document.getElementById("loadingOverlay").querySelector("h3").innerText =
                  "पंजीकरण सफल!";
                document.getElementById("loadingOverlay").querySelector("p").innerText =
                  "ID Card तैयार किया जा रहा है...";
        
                // Small buffer so the sheet write is fully committed before the
                // ID card page tries to read it back (avoids a race condition).
                await new Promise(resolve => setTimeout(resolve, 1500));
        
                // Go straight to the ID card view for this member
                window.location.href =
                  "identity-card.html?memberId=" + encodeURIComponent(memberId);
        
                return;
        
              }
              else if(result.status === "duplicate"){

                );

                alert(

                );
        
              }

              document.getElementById("education").value = "";

              document.getElementById("district").value = "";
              document.getElementById("pinCode").value = "";
              document.getElementById("contact1").value = "";
              document.getElementById("aadhaarNumber").value = "";
              document.getElementById("permanentAddress").value = "";
              document.getElementById("currentAddress").value = "";
              document.getElementById("photo").value = "";
        
              // =========================
              // HIDE LOADER
              // =========================
        
              document.getElementById("loadingOverlay").style.display = "none";

              document.getElementById("submitBtn").innerText =

              console.log(error);

              alert(
                "डेटा सेव करने में समस्या आ रही है"
              );
        
            }
        
          }
        
          // =========================
          // CONVERT IMAGE
          // =========================
        
          function convertToBase64(file){
        
            return new Promise((resolve, reject) => {
        
              const reader =
                new FileReader();
        
              reader.readAsDataURL(file);
        
              reader.onload = () =>
                resolve(reader.result);
        
              reader.onerror = error =>
                reject(error);
        
            });
        
          }
