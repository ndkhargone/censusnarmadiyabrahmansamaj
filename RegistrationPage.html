<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Samaj Registration & ID Card</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:linear-gradient(to right,#fff5e6,#ffe6e6);
      padding:30px;
    }

    h1{
      text-align:center;
      color:#8b0000;
      margin-bottom:25px;
    }

    .container{
      display:flex;
      gap:30px;
      flex-wrap:wrap;
      justify-content:center;
    }

    /* FORM */

    .form-box{
      width:420px;
      background:white;
      padding:25px;
      border-radius:18px;
      box-shadow:0 5px 15px rgba(0,0,0,0.2);
    }

    .form-box h2{
      text-align:center;
      margin-bottom:20px;
      color:#8b0000;
    }

    .input-group{
      margin-bottom:15px;
    }

    label{
      font-weight:bold;
      display:block;
      margin-bottom:6px;
      color:#333;
    }

    input,
    textarea,
    select{
      width:100%;
      padding:10px;
      border:1px solid #ccc;
      border-radius:10px;
      font-size:15px;
    }

    textarea{
      resize:none;
    }

    button{
      width:100%;
      padding:12px;
      border:none;
      background:#8b0000;
      color:white;
      border-radius:12px;
      font-size:17px;
      cursor:pointer;
      transition:0.3s;
      margin-top:10px;
    }

    button:hover{
      background:#a50000;
    }

    /* ID CARD */

    .card-box{
      width:360px;
    }

    .id-card{
      background:white;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 5px 15px rgba(0,0,0,0.2);
      border:4px solid #8b0000;
    }

    .card-header{
      background:#8b0000;
      color:white;
      text-align:center;
      padding:18px;
    }

    .card-header img{
      width:70px;
      margin-bottom:8px;
    }

    .card-body{
      padding:20px;
      text-align:center;
    }

    .profile{
      width:110px;
      height:110px;
      border-radius:50%;
      border:4px solid #8b0000;
      object-fit:cover;
      margin-bottom:12px;
    }

    .member-name{
      color:#8b0000;
      margin-bottom:15px;
    }

    .info{
      text-align:left;
      margin-top:10px;
      line-height:2;
      font-size:15px;
    }

    .info strong{
      color:#8b0000;
    }

    .footer{
      background:#f3f3f3;
      padding:12px;
      text-align:center;
      font-size:14px;
      font-weight:bold;
    }

    .download-btn{
      margin-top:15px;
      background:#006400;
    }

    .download-btn:hover{
      background:#008000;
    }

    @media(max-width:900px){
      .container{
        flex-direction:column;
        align-items:center;
      }
    }
  </style>
</head>
<body>

  <h1>Narmadiya Brahmin Samaj</h1>

  <div class="container">

    <!-- FORM -->

    <div class="form-box">
      <h2>Samaj Registration Form</h2>

      <div class="input-group">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="Enter full name">
      </div>

      <div class="input-group">
        <label>Father Name</label>
        <input type="text" id="father" placeholder="Enter father name">
      </div>

      <div class="input-group">
        <label>Mobile Number</label>
        <input type="text" id="mobile" placeholder="Enter mobile number">
      </div>

      <div class="input-group">
        <label>Date of Birth</label>
        <input type="date" id="dob">
      </div>

      <div class="input-group">
        <label>Address</label>
        <textarea id="address" rows="3" placeholder="Enter address"></textarea>
      </div>

      <div class="input-group">
        <label>Gender</label>
        <select id="gender">
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>
      </div>

      <div class="input-group">
        <label>Upload Photo</label>
        <input type="file" id="photo" accept="image/*">
      </div>

      <button onclick="generateCard()">Generate ID Card</button>
    </div>


    <!-- ID CARD -->

    <div class="card-box">

      <div class="id-card" id="idCard">

        <div class="card-header">
          <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
          <h2>Narmadiya Brahmin Samaj</h2>
          <p>Official Member ID Card</p>
        </div>

        <div class="card-body">

          <img
            src="https://cdn-icons-png.flaticon.com/512/149/149071.png"
            class="profile"
            id="cardPhoto"
          >

          <h2 class="member-name" id="cardName">Your Name</h2>

          <div class="info">
            <p><strong>ID No:</strong> <span id="cardId">NB2026001</span></p>
            <p><strong>Father:</strong> <span id="cardFather">-</span></p>
            <p><strong>Mobile:</strong> <span id="cardMobile">-</span></p>
            <p><strong>DOB:</strong> <span id="cardDob">-</span></p>
            <p><strong>Gender:</strong> <span id="cardGender">-</span></p>
            <p><strong>Address:</strong> <span id="cardAddress">-</span></p>
          </div>

        </div>

        <div class="footer">
          Verified Samaj Member
        </div>

      </div>

      <button class="download-btn" onclick="window.print()">
        Download / Print ID Card
      </button>

    </div>

  </div>


  <script>

    function generateCard(){

      document.getElementById("cardName").innerText =
        document.getElementById("name").value;

      document.getElementById("cardFather").innerText =
        document.getElementById("father").value;

      document.getElementById("cardMobile").innerText =
        document.getElementById("mobile").value;

      document.getElementById("cardDob").innerText =
        document.getElementById("dob").value;

      document.getElementById("cardGender").innerText =
        document.getElementById("gender").value;

      document.getElementById("cardAddress").innerText =
        document.getElementById("address").value;

      // Random ID generation
      let randomId = "NB" + Math.floor(100000 + Math.random() * 900000);
      document.getElementById("cardId").innerText = randomId;

      // Photo Preview
      let file = document.getElementById("photo").files[0];

      if(file){
        let reader = new FileReader();

        reader.onload = function(e){
          document.getElementById("cardPhoto").src = e.target.result;
        }

        reader.readAsDataURL(file);
      }

      alert("ID Card Generated Successfully!");
    }

  </script>

</body>
</html>
