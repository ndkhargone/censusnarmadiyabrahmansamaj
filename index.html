<!DOCTYPE html>
<html lang="hi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>समाज पंजीकरण फॉर्म</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#02151c;
      color:white;
    }

    /* HEADER */

    .main-header{
      width:100%;
      padding:70px 20px;
      text-align:center;
      background:linear-gradient(
        135deg,
        #0d5d73,
        #2b8aa0,
        #5aa7b5
      );
    }

    .tagline{
      display:inline-block;
      border:1px solid rgba(255,255,255,0.5);
      padding:10px 25px;
      border-radius:30px;
      font-size:20px;
      margin-bottom:25px;
      background:rgba(255,255,255,0.08);
    }

    .main-header h1{
      font-size:48px;
      margin-bottom:20px;
      line-height:1.3;
    }

    .line{
      width:120px;
      height:5px;
      background:#ffd54f;
      margin:0 auto 20px;
      border-radius:10px;
    }

    .main-header p{
      font-size:28px;
    }

    /* FORM */

    .wrapper{
      padding:40px 20px;
      display:flex;
      justify-content:center;
    }

    .container{
      width:100%;
      max-width:1200px;
      background:#06212a;
      border:1px solid #0f738f;
      border-radius:20px;
      padding:35px;
    }

    .container h2{
      text-align:center;
      margin-bottom:30px;
      font-size:34px;
    }

    .form-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:25px;
    }

    .input-box{
      display:flex;
      flex-direction:column;
    }

    label{
      margin-bottom:10px;
      font-size:19px;
      color:#d6d6d6;
    }

    input,
    select,
    textarea{
      padding:15px;
      border:none;
      border-radius:12px;
      background:#0d3441;
      color:white;
      font-size:16px;
      outline:none;
    }

    textarea{
      resize:none;
    }

    input:focus,
    select:focus,
    textarea:focus{
      border:1px solid #20c0dc;
    }

    .full-width{
      grid-column:span 2;
    }

    button{
      width:100%;
      padding:18px;
      border:none;
      border-radius:14px;
      background:#0f738f;
      color:white;
      font-size:22px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#1694b5;
    }

    @media(max-width:768px){

      .form-grid{
        grid-template-columns:1fr;
      }

      .full-width{
        grid-column:span 1;
      }

      .main-header h1{
        font-size:30px;
      }

      .main-header p{
        font-size:20px;
      }

      .container{
        padding:20px;
      }

    }

  </style>
</head>

<body>

  <!-- HEADER -->

  <div class="main-header">

    <div class="tagline">
      ॥ नर्मदे हर ॥
    </div>

    <h1>
      अखिल भारतीय नर्मदीय ब्राह्मण समाज महासभा
    </h1>

    <div class="line"></div>

    <p>
      सामाजिक जनगणना पोर्टल
    </p>

  </div>


  <!-- FORM -->

  <div class="wrapper">

    <div class="container">

      <h2>समाज पंजीकरण फॉर्म</h2>

      <div class="form-grid">

        <div class="input-box">
          <label>पूरा नाम</label>
          <input type="text" id="fullName">
        </div>

        <div class="input-box">
          <label>पिता का नाम</label>
          <input type="text" id="fatherName">
        </div>

        <div class="input-box">
          <label>माता का नाम</label>
          <input type="text" id="motherName">
        </div>

        <div class="input-box">
          <label>गोत्र</label>
          <input type="text" id="gotra">
        </div>

        <div class="input-box">
          <label>मूल निवासी</label>
          <input type="text" id="nativePlace">
        </div>

        <div class="input-box">
          <label>आयु</label>
          <input type="number" id="age">
        </div>

        <div class="input-box">
          <label>वैवाहिक स्थिति</label>

          <select id="maritalStatus">
            <option>Married</option>
            <option>Unmarried</option>
          </select>

        </div>

        <div class="input-box">
          <label>व्यवसाय</label>
          <input type="text" id="profession">
        </div>

   
        <div class="input-box">
          <label>ब्लड ग्रुप</label>
          <input type="text" id="bloodGroup">
        </div>

        <!-- IKAI -->

        <div class="input-box">

          <label>इकाई नाम</label>

          <select id="ikaiName">

            <option value="">इकाई चुनें</option>

            <option>खंडवा (Khandwa)</option>
            <option>होशंगाबाद (Hoshangabad)</option>
            <option>धार (Dhar)</option>
            <option>भोपाल (Bhopal)</option>
            <option>कोलार भोपाल (Kolar Bhopal)</option>
            <option>मिलन भोपाल (Milan Bhopal)</option>
            <option>उज्जैन (Ujjain)</option>
            <option>रतलाम (Ratlam)</option>
            <option>जबलपुर (Jabalpur)</option>
            <option>दिल्ली एनसीआर (Delhi NCR)</option>
            <option>रायपुर (Raipur)</option>
            <option>मुंबई (Mumbai)</option>
            <option>गुजरात (Gujarat)</option>
            <option>खरगोन (Khargone)</option>
            <option>बरवानी (Barwani)</option>
            <option>हरदा (Harda)</option>
            <option>इंदौर (Indore)</option>
            <option>इंदौर एरिया 02 (Indore Area 02)</option>
            <option>प्रयागराज (Prayagraj)</option>
            <option>सनावद (Sanawad)</option>
            <option>महेश्वर (Maheshwar)</option>
            <option>तिमरनी (Timarni)</option>
            <option>नागपुर (Nagpur)</option>
            <option>मंदेश्वर (Mandeshwar)</option>
            <option>राहतगांव (Rahatgaon)</option>
            <option>खिरकिया (Khirkiya)</option>
            <option>हरसूद (Harsud)</option>
            <option>सिराली (Sirali)</option>
            <option>पंधाना (Pandhana)</option>
            <option>कासरावद (Kasrawad)</option>
            <option>बड़वाह (Barwah)</option>
            <option>सेंधवा (Sendhwa)</option>
            <option>म्हो (Mhow)</option>
            <option>देवास (Dewas)</option>
            <option>मुंडी (Mundi)</option>
            <option>बामनला (Bamnala)</option>
            <option>हरसी (Harsi)</option>
            <option>सिहोर (Sehore)</option>
            <option>पीथमपुर (Pithampur)</option>
            <option>राऊ (Rau)</option>
            <option>धामनोद (Dhamnod)</option>
            <option>सिओनी मालवा (Seoni Malwa)</option>
            <option>आष्टा (Ashta)</option>
            <option>बेदिया (Bedia)</option>
            <option>धारमपुरी (Dharampuri)</option>
            <option>सांवेर (Sanwer)</option>
            <option>बकानेर (Bakaner)</option>
            <option>नरमदा नगर पुनासा (Narmada Nagar Punasa)</option>
			<option>Others</option>
          </select>

        </div>

        <div class="input-box">
          <label>जिला</label>
          <input type="text" id="district">
        </div>

        <div class="input-box">
          <label>पिन कोड</label>
          <input type="text" id="pinCode">
        </div>

        <div class="input-box">
          <label>मोबाइल नंबर 1</label>
          <input type="text" id="contact1">
        </div>

        <div class="input-box">
          <label>मोबाइल नंबर 2</label>
          <input type="text" id="contact2">
        </div>

        <div class="input-box">
          <label>आधार कार्ड नंबर</label>
          <input type="text" id="aadhaarNumber">
        </div>

        <div class="input-box">
          <label>फोटो अपलोड करें</label>
          <input type="file" id="photo" accept="image/*">
        </div>

        <div class="input-box full-width">
          <label>वर्तमान पता</label>
          <textarea rows="4" id="currentAddress"></textarea>
        </div>

        <div class="input-box full-width">

          <button type="button" onclick="generateCard()">
            जमा करें
          </button>

        </div>

      </div>

    </div>

  </div>


  <script>

    function generateCard(){

      localStorage.setItem(
        "memberId",
        "NB" + Math.floor(100000 + Math.random()*900000)
      );

      localStorage.setItem(
        "fullName",
        document.getElementById("fullName").value
      );

      localStorage.setItem(
        "fatherName",
        document.getElementById("fatherName").value
      );

      localStorage.setItem(
        "motherName",
        document.getElementById("motherName").value
      );

      localStorage.setItem(
        "gotra",
        document.getElementById("gotra").value
      );

      localStorage.setItem(
        "nativePlace",
        document.getElementById("nativePlace").value
      );

      localStorage.setItem(
        "age",
        document.getElementById("age").value
      );

      localStorage.setItem(
        "maritalStatus",
        document.getElementById("maritalStatus").value
      );

      localStorage.setItem(
        "profession",
        document.getElementById("profession").value
      );

      localStorage.setItem(
        "professionDomain",
        document.getElementById("professionDomain").value
      );

      localStorage.setItem(
        "bloodGroup",
        document.getElementById("bloodGroup").value
      );

      localStorage.setItem(
        "ikaiName",
        document.getElementById("ikaiName").value
      );

      localStorage.setItem(
        "district",
        document.getElementById("district").value
      );

      localStorage.setItem(
        "pinCode",
        document.getElementById("pinCode").value
      );

      localStorage.setItem(
        "contact1",
        document.getElementById("contact1").value
      );

      localStorage.setItem(
        "contact2",
        document.getElementById("contact2").value
      );

      localStorage.setItem(
        "aadhaarNumber",
        document.getElementById("aadhaarNumber").value
      );

      localStorage.setItem(
        "currentAddress",
        document.getElementById("currentAddress").value
      );

      let file =
        document.getElementById("photo").files[0];

      if(file){

        let reader = new FileReader();

        reader.onload = function(e){

          localStorage.setItem(
            "photo",
            e.target.result
          );

          window.location.href =
            "identity-card.html";

        };

        reader.readAsDataURL(file);

      }else{

        window.location.href =
          "identity-card.html";
      }

    }

  </script>

</body>
</html>
