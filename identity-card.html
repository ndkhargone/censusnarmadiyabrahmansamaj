<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>समाज पहचान पत्र</title>

  <!-- ✅ PDF LIBRARIES -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#e8e8e8;
      padding:30px;
      text-align:center;
    }

    .search-box{
      margin-bottom:20px;
    }

    input{
      padding:12px;
      width:300px;
      border-radius:8px;
      border:1px solid #ccc;
    }

    button{
      padding:12px 20px;
      border:none;
      background:#0b5b74;
      color:white;
      border-radius:8px;
      cursor:pointer;
      margin-left:10px;
    }

    .id-card{
      max-width:950px;
      margin:auto;
      background:white;
      border:4px solid #222;
      border-radius:15px;
      overflow:hidden;
      box-shadow:0 0 15px rgba(0,0,0,0.2);
      display:none;
    }

    .top-header{
      background:linear-gradient(135deg,#0b5b74,#1d8aa1);
      color:white;
      text-align:center;
      padding:25px 15px;
    }

    .top-header h1{
      font-size:34px;
    }

    .card-body{
      display:flex;
      gap:20px;
      padding:20px;
    }

    .left-section{
      flex:2;
    }

    .right-section{
      width:230px;
      text-align:center;
    }

    .photo-box img{
      width:100%;
      height:220px;
      object-fit:cover;
      border:3px solid #222;
      border-radius:10px;
    }

    table{
      width:100%;
      border-collapse:collapse;
    }

    table td{
      border:2px solid #222;
      padding:8px;
      font-size:15px;
    }

    table td:first-child{
      width:40%;
      font-weight:bold;
      background:#f2f2f2;
    }

    .signature-section{
      display:flex;
      justify-content:flex-end;
      margin:40px 20px;
    }

    .signature-line{
      border-top:2px solid black;
      margin-top:60px;
      padding-top:8px;
      font-weight:bold;
      width:220px;
      text-align:center;
    }

    .download-btn{
      width:100%;
      padding:16px;
      border:none;
      background:#0b5b74;
      color:white;
      font-size:20px;
      cursor:pointer;
    }

    .status{
      margin:10px;
      font-size:14px;
      color:#333;
    }

  </style>
</head>

<body>

  <!-- SEARCH -->
  <div class="search-box">
    <input type="text" id="memberInput" placeholder="Enter Member ID">
    <button onclick="searchMember()">Search</button>
  </div>

  <div class="status" id="status"></div>

  <!-- ID CARD -->
  <div class="id-card" id="card">

    <div class="top-header">
      <h1>अखिल भारतीय नार्मदीय ब्राह्मण समाज महासभा</h1>
      <h3>समाज पहचान पत्र</h3>
    </div>

    <div class="card-body">

      <div class="left-section">

        <table>

          <tr><td>सदस्य आईडी</td><td id="memberId"></td></tr>
          <tr><td>पूरा नाम</td><td id="fullName"></td></tr>
          <tr><td>पिता का नाम</td><td id="fatherName"></td></tr>
          <tr><td>माता का नाम</td><td id="motherName"></td></tr>
          <tr><td>गोत्र</td><td id="gotra"></td></tr>
          <tr><td>मूल निवासी</td><td id="nativePlace"></td></tr>
          <tr><td>आयु</td><td id="age"></td></tr>
          <tr><td>व्यवसाय</td><td id="profession"></td></tr>
          <tr><td>ब्लड ग्रुप</td><td id="bloodGroup"></td></tr>
          <tr><td>इकाई नाम</td><td id="ikaiName"></td></tr>
          <tr><td>मोबाइल नंबर</td><td id="contact1"></td></tr>

        </table>

      </div>

      <div class="right-section">
        <img id="profilePhoto"
             src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
      </div>

    </div>

    <div class="signature-section">
      <div class="signature-line">महासभा अध्यक्ष</div>
    </div>

    <!-- ✅ PDF DOWNLOAD -->
    <button class="download-btn" onclick="downloadPDF()">
      डाउनलोड PDF करें
    </button>

  </div>

<script>

async function searchMember() {

  const id = document.getElementById("memberInput").value;

  if (!id) {
    alert("Enter Member ID");
    return;
  }

  const url =
    "https://script.google.com/macros/s/AKfycbxOpsBgJrAAAyXMQ40cnZHBOE8zZniCF2RDxzchh4XrAjuJQoB9xGwX-2U-tDicsgYl/exec"
    + "?memberId=" + encodeURIComponent(id);

  try {

    const response = await fetch(url, {
      method: "GET"
    });

    const text = await response.text();
    const result = JSON.parse(text);

    if (result.status !== "success") {
      alert("Member not found");
      return;
    }

    const data = result.data;

    document.getElementById("card").style.display = "block";

    document.getElementById("memberId").innerText = data.memberId;
    document.getElementById("fullName").innerText = data.fullName;
    document.getElementById("fatherName").innerText = data.fatherName;
    document.getElementById("motherName").innerText = data.motherName;
    document.getElementById("gotra").innerText = data.gotra;
    document.getElementById("nativePlace").innerText = data.nativePlace;
    document.getElementById("age").innerText = data.age;
    document.getElementById("profession").innerText = data.profession;
    document.getElementById("bloodGroup").innerText = data.bloodGroup;
    document.getElementById("ikaiName").innerText = data.ikaiName;
    document.getElementById("contact1").innerText = data.contact1;

    document.getElementById("profilePhoto").src =
      data.photo || "https://cdn-icons-png.flaticon.com/512/149/149071.png";

  } catch (err) {
    console.error(err);
    alert("Network error (check server or Live Server)");
  }
}

async function downloadPDF() {

  const { jsPDF } = window.jspdf;

  const card = document.getElementById("card");

  if (!card || card.style.display === "none") {
    alert("❌ पहले ID कार्ड लोड करें");
    return;
  }

  const canvas = await html2canvas(card, {
    scale: 2,
    useCORS: true
  });

  const imgData = canvas.toDataURL("image/png");

  const pdf = new jsPDF("p", "mm", "a4");

  const pageWidth = 210;
  const imgHeight = (canvas.height * pageWidth) / canvas.width;

  pdf.addImage(imgData, "PNG", 0, 0, pageWidth, imgHeight);

  pdf.save("Samaj_ID_Card.pdf");
}

</script>

</body>
</html>
