<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>समाज पहचान पत्र</title>

<!-- PDF LIBRARIES -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

body{
  background:#e8e8e8;
  padding:30px;
  text-align:center;
  font-family:Arial;
}

input{
  padding:12px;
  width:350px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:16px;
}

button{
  padding:12px 20px;
  background:#0b5b74;
  color:white;
  border:none;
  cursor:pointer;
  border-radius:8px;
  font-size:16px;
}

/* ================= CARD ================= */

.id-card{
  max-width:1100px;
  margin:auto;
  background:white;
  border:4px solid #111;
  display:none;
  border-radius:18px;
  overflow:hidden;
  margin-top:20px;
}

/* HEADER */

.card-header{
  background:linear-gradient(135deg,#0d5d73,#2b8aa0,#5aa7b5);
  color:white;
  text-align:center;
  padding:35px 20px;
}

.card-header h1{
  font-size:34px;
  margin-bottom:10px;
}

.card-header p{
  font-size:22px;
}

/* BODY */

.container{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  padding:30px;
  gap:30px;
}

.left{
  flex:2;
}

table{
  width:100%;
  border-collapse:collapse;
}

td{
  border:2px solid #111;
  padding:10px;
  font-size:20px;
}

td:first-child{
  width:35%;
  font-weight:bold;
  background:#f2f2f2;
}

/* PHOTO */

.photo{
  width:250px;
}

.photo img{
  width:100%;
  height:300px;
  object-fit:cover;
  border:3px solid #111;
  border-radius:10px;
  background:white;
}

/* DOWNLOAD BUTTON */

.download{
  width:100%;
  padding:18px;
  background:#0b5b74;
  color:white;
  border:none;
  font-size:22px;
  cursor:pointer;
  border-radius:0;
}

/* STATUS */

.status{
  margin:15px;
  font-size:18px;
  color:#333;
}

</style>
</head>

<body>

<input id="memberInput" placeholder="Enter Member ID">
<button onclick="searchMember()">Search</button>

<div class="status" id="status"></div>

<!-- ================= ID CARD ================= -->

<div class="id-card" id="card">

  <!-- HEADER -->
  <div class="card-header">
    <h1>अखिल भारतीय नार्मदीय ब्राह्मण समाज महासभा</h1>
    <p>सदस्य पहचान पत्र</p>
  </div>

  <!-- BODY -->
  <div class="container">

    <!-- LEFT TABLE -->
    <div class="left">

      <table>

        <tr><td>आईडी</td><td id="memberId"></td></tr>
        <tr><td>नाम</td><td id="fullName"></td></tr>
        <tr><td>पिता</td><td id="fatherName"></td></tr>
        <tr><td>माता</td><td id="motherName"></td></tr>
        <tr><td>गोत्र</td><td id="gotra"></td></tr>
        <tr><td>शहर</td><td id="nativePlace"></td></tr>
        <tr><td>आयु</td><td id="age"></td></tr>
        <tr><td>व्यवसाय</td><td id="profession"></td></tr>
        <tr><td>ब्लड ग्रुप</td><td id="bloodGroup"></td></tr>
        <tr><td>मोबाइल</td><td id="contact1"></td></tr>

      </table>

    </div>

    <!-- PHOTO -->
    <div class="photo">
      <img id="profilePhoto">
    </div>

  </div>

  <!-- DOWNLOAD BUTTON -->
  <button class="download" onclick="downloadPDF()">
    Download PDF
  </button>

</div>

<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxzuNAnPCskNUWVVFw9ZGUZuMhEFtLPV_hF1DNKE-xjgr1EScyPzUKgarRSqfcsfvv9/exec";
/* ================= SEARCH MEMBER ================= */

async function searchMember(){

  const id = document.getElementById("memberInput").value.trim();

  if(!id){
    alert("Enter Member ID");
    return;
  }

  document.getElementById("status").innerText = "Loading...";

  try{

    const response = await fetch(
      SCRIPT_URL + "?memberId=" + encodeURIComponent(id)
    );

    const text = await response.text();

    console.log("RAW RESPONSE:", text);

    const result = JSON.parse(text);

    if(result.status !== "success"){

      document.getElementById("status").innerText = "Member not found";

      alert("Member not found");

      return;
    }

    const d = result.data;
console.log("PHOTO URL FROM APPS SCRIPT:", d);
    document.getElementById("card").style.display = "block";

    document.getElementById("status").innerText = "Data Loaded";

    /* SET VALUES */

    document.getElementById("memberId").innerText =
      d.memberId || "";

    document.getElementById("fullName").innerText =
      d.fullName || "";

    document.getElementById("fatherName").innerText =
      d.fatherName || "";

    document.getElementById("motherName").innerText =
      d.motherName || "";

    document.getElementById("gotra").innerText =
      d.gotra || "";

    document.getElementById("nativePlace").innerText =
      d.nativePlace || "";

    document.getElementById("age").innerText =
      d.age || "";

    document.getElementById("profession").innerText =
      d.profession || "";

    document.getElementById("bloodGroup").innerText =
      d.bloodGroup || "";

    document.getElementById("contact1").innerText =
      d.contact1 || "";

    /* ================= PHOTO ================= */

    const img = document.getElementById("profilePhoto");

    if(d.photo){

      console.log("PHOTO URL FROM APPS SCRIPT:", d.photo);

      let fileId = "";

      const match = d.photo.match(/[-\w]{25,}/);

      if(match){
        fileId = match[0];
      }

      if(fileId){

         img.src = "https://drive.google.com/file/d/" + fileId + "/view?usp=sharing";

        console.log("FINAL PHOTO URL:", img.src);

      }else{

        img.src = d.photo;
      }

    }else{

      console.log("NO PHOTO FOUND");

      img.src =
        "https://cdn-icons-png.flaticon.com/512/149/149071.png";
    }

  }catch(err){

    console.error(err);

    document.getElementById("status").innerText = "Error loading data";

    alert("Network / Apps Script Error");
  }
}

/* ================= DOWNLOAD PDF ================= */

async function downloadPDF(){

  const card = document.getElementById("card");

  const images = card.getElementsByTagName("img");

  for(let img of images){

    if(!img.complete){

      await new Promise(resolve => {

        img.onload = resolve;
        img.onerror = resolve;

      });
    }
  }

  const canvas = await html2canvas(card,{
    scale:2,
    useCORS:true
  });

  const imgData = canvas.toDataURL("image/png");

  const { jsPDF } = window.jspdf;

  const pdf = new jsPDF("p","mm","a4");

  const pageWidth = 210;

  const pageHeight =
    (canvas.height * pageWidth) / canvas.width;

  pdf.addImage(
    imgData,
    "PNG",
    0,
    0,
    pageWidth,
    pageHeight
  );

  pdf.save("Samaj_ID_Card.pdf");
}

</script>

</body>
</html>
