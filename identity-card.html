<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>समाज पहचान पत्र</title>

<!-- PDF LIBRARIES -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
  background:#e8e8e8;
  padding:20px;
  text-align:center;
  font-family:Arial;
}

input{
  padding:12px;
  width:350px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:16px;
  max-width:90%;
}

button{
  padding:12px 20px;
  background:#0b5b74;
  color:white;
  border:none;
  cursor:pointer;
  border-radius:8px;
  font-size:16px;
}

/* ================= CARD ================= */
.id-card{
  max-width:1100px;
  margin:auto;
  background:white;
  border:4px solid #111;
  display:none;
  border-radius:18px;
  overflow:hidden;
  margin-top:20px;
}

/* HEADER */
.card-header{
  background:linear-gradient(135deg,#0d5d73,#2b8aa0,#5aa7b5);
  color:white;
  text-align:center;
  padding:25px 15px;
}
.card-header h1{
  font-size:28px;
  margin-bottom:8px;
}
.card-header p{
  font-size:18px;
}

/* BODY */
.container{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  padding:20px;
  gap:20px;
}
.left{
  flex:2;
}
table{
  width:100%;
  border-collapse:collapse;
}
td{
  border:2px solid #111;
  padding:8px;
  font-size:18px;
}
td:first-child{
  width:35%;
  font-weight:bold;
  background:#f2f2f2;
}

/* PHOTO */
.photo{
  width:220px;
  display:flex;
  justify-content:center;
  align-items:center;
}
.photo img{
  width:100%;
  height:260px;
  object-fit:cover;
  border:3px solid #111;
  border-radius:10px;
  background:white;
}

/* DOWNLOAD BUTTON */
.download{
  width:100%;
  padding:14px;
  background:#0b5b74;
  color:white;
  border:none;
  font-size:20px;
  cursor:pointer;
  border-radius:0;
}

/* STATUS */
.status{
  margin:15px;
  font-size:16px;
  color:#333;
}

/* ================= RESPONSIVE ================= */
@media (max-width: 768px) {
  .container {
    flex-direction: column;
    align-items: center;
  }
  .photo {
    width: 180px;
    margin-top: 15px;
  }
  .photo img {
    height: 220px;
  }
  table td { font-size:16px; }
  .card-header h1 { font-size:22px; }
  .card-header p { font-size:16px; }
}
@media (max-width: 480px) {
  table td { font-size:14px; }
  .photo { width:130px; }
  .photo img { height:160px; }
  .card-header h1 { font-size:18px; }
  .card-header p { font-size:14px; }
}
</style>
</head>

<body>

<input id="memberInput" placeholder="Enter Member ID">
<button onclick="searchMember()">Search</button>

<div class="status" id="status"></div>

<!-- ================= ID CARD ================= -->
<div class="id-card" id="card">
  <!-- HEADER -->
  <div class="card-header">
    <h1>अखिल भारतीय नार्मदीय ब्राह्मण समाज महासभा</h1>
    <p>सदस्य पहचान पत्र</p>
  </div>

  <!-- BODY -->
  <div class="container">
    <!-- LEFT TABLE -->
    <div class="left">
      <table>
        <tr><td>आईडी</td><td id="memberId"></td></tr>
        <tr><td>नाम</td><td id="fullName"></td></tr>
        <tr><td>पिता</td><td id="fatherName"></td></tr>
        <tr><td>माता</td><td id="motherName"></td></tr>
        <tr><td>गोत्र</td><td id="gotra"></td></tr>
        <tr><td>शहर</td><td id="nativePlace"></td></tr>
        <tr><td>आयु</td><td id="age"></td></tr>
        <tr><td>व्यवसाय</td><td id="profession"></td></tr>
        <tr><td>ब्लड ग्रुप</td><td id="bloodGroup"></td></tr>
        <tr><td>मोबाइल</td><td id="contact1"></td></tr>
        <tr><td>आधार नंबर</td><td id="aadhaarNumber"></td></tr>
      </table>
    </div>

    <!-- PHOTO -->
    <div class="photo">
      <img id="profilePhoto" alt="Member Photo">
    </div>
  </div>

  <!-- DOWNLOAD BUTTON -->
  <button class="download" onclick="downloadPDF()">Download PDF</button>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxzuNAnPCskNUWVVFw9ZGUZuMhEFtLPV_hF1DNKE-xjgr1EScyPzUKgarRSqfcsfvv9/exec";

/* ================= SEARCH MEMBER ================= */
async function searchMember(){
  const id = document.getElementById("memberInput").value.trim();
  if(!id){ alert("Enter Member ID"); return; }
  document.getElementById("status").innerText = "Loading...";

  try{
    const response = await fetch(SCRIPT_URL + "?memberId=" + encodeURIComponent(id));
    const text = await response.text();
    const result = JSON.parse(text);

    if(result.status !== "success"){
      document.getElementById("status").innerText = "Member not found";
      alert("Member not found");
      return;
    }

    const d = result.data;
    document.getElementById("card").style.display = "block";
    document.getElementById("status").innerText = "Data Loaded";

    /* SET VALUES */
    document.getElementById("memberId").innerText = d.memberId || "";
    document.getElementById("fullName").innerText = d.fullName || "";
    document.getElementById("fatherName").innerText = d.fatherName || "";
    document.getElementById("motherName").innerText = d.motherName || "";
    document.getElementById("gotra").innerText = d.gotra || "";
    document.getElementById("nativePlace").innerText = d.nativePlace || "";
    document.getElementById("age").innerText = d.age || "";
    document.getElementById("profession").innerText = d.profession || "";
    document.getElementById("bloodGroup").innerText = d.bloodGroup || "";
    document.getElementById("contact1").innerText = d.contact1 || "";
    document.getElementById("aadhaarNumber").innerText = formatAadhaar(d.aadhaarNumber);

    /* PHOTO */
    const img = document.getElementById("profilePhoto");
    if(d.photo){
      let fileId = "";
      const match = d.photo.match(/[-\w]{25,}/);
      if(match){ fileId = match[0]; }
      if(fileId){
        img.src = "https://lh3.googleusercontent.com/d/" + fileId;
      } else {
        img.src = d.photo;
      }
    } else {
      img.src = "https://cdn-icons-png.flaticon.com/512/149/149071.png";
    }
  }catch(err){
    console.error(err);
    document.getElementById("status").innerText = "Error loading data";
    alert("Network / Apps Script Error");
  }
}

/* Aadhaar formatting: ensure 12 digits */
function formatAadhaar(num){
  if(!num) return "";
  let str = String(num).replace(/\D/g,"");
  if(str.length === 12){
    return str.replace(/(\d{4})(\d{4})(\d{4})/, "$1-$2-$3");
  }
  return str;
}

/* ================= DOWNLOAD PDF ================= */
async function downloadPDF(){
  const card = document.getElementById("card");
  const images = card.getElementsByTagName("img");
  for(let img of images){
    if(!img.complete){
      await new Promise(resolve => {
        img.onload = resolve;
        img.onerror = resolve;
      });
    }
  }
 const canvas = await html2canvas(card,{ scale:2, useCORS:true });
  const imgData = canvas.toDataURL("image/png");

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF("p","mm","a4");   // ✅ fixed initializer

  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();

  // Scale the card to fit the page
  const ratio = Math.min(pageWidth / canvas.width, pageHeight / canvas.height);
  const imgWidth = canvas.width * ratio;
  const imgHeight = canvas.height * ratio;

  pdf.addImage(imgData, "PNG", 0, 0, imgWidth, imgHeight);
  pdf.save("Samaj_ID_Card.pdf");
}
window.addEventListener("DOMContentLoaded", function(){

    const savedData = localStorage.getItem("memberData");

    if(savedData){

        try{

            const d = JSON.parse(savedData);

            document.getElementById("card").style.display = "block";
            document.getElementById("status").innerText =
                "Registration Successful";

            document.getElementById("memberId").innerText =
                d.memberId || "";

            document.getElementById("fullName").innerText =
                d.fullName || "";

            document.getElementById("fatherName").innerText =
                d.fatherName || "";

            document.getElementById("motherName").innerText =
                d.motherName || "";

            document.getElementById("gotra").innerText =
                d.gotra || "";

            document.getElementById("nativePlace").innerText =
                d.nativePlace || "";

            document.getElementById("age").innerText =
                d.age || "";

            document.getElementById("profession").innerText =
                d.profession || "";

            document.getElementById("bloodGroup").innerText =
                d.bloodGroup || "";

            document.getElementById("contact1").innerText =
                d.contact1 || "";

            document.getElementById("aadhaarNumber").innerText =
                formatAadhaar(d.aadhaarNumber);

            // PHOTO
            const img =
                document.getElementById("profilePhoto");

            if(d.photo){

                const match =
                    d.photo.match(/[-\w]{25,}/);

                if(match){

                    img.src =
                        "https://lh3.googleusercontent.com/d/" +
                        match[0];

                }else{

                    img.src = d.photo;

                }

            }else{

                img.src =
                    "https://cdn-icons-png.flaticon.com/512/149/149071.png";

            }

        }catch(error){

            console.error(error);

        }

    }

});
</script>

</body>
</html>
