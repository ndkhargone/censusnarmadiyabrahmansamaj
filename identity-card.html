<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>समाज पहचान पत्र</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
  background:#e8e8e8;
  padding:30px;
  text-align:center;
  font-family:Arial;
}

input{
  padding:12px;
  width:300px;
  border-radius:8px;
}

button{
  padding:12px 20px;
  background:#0b5b74;
  color:white;
  border:none;
  cursor:pointer;
  border-radius:8px;
}

/* CARD */
.id-card{
  max-width:900px;
  margin:auto;
  background:white;
  border:3px solid #000;
  display:none;
  border-radius:12px;
  overflow:hidden;
}

.card-header{
  background:linear-gradient(135deg,#0d5d73,#2b8aa0,#5aa7b5);
  color:white;
  padding:20px;
  text-align:center;
}

.container{
  display:flex;
  padding:20px;
  gap:20px;
}

table{
  width:100%;
  border-collapse:collapse;
}

td{
  border:1px solid #000;
  padding:6px;
}

td:first-child{
  font-weight:bold;
  background:#f2f2f2;
}

.photo img{
  width:200px;
  height:220px;
  object-fit:cover;
  border:2px solid black;
  border-radius:8px;
}

.download{
  width:100%;
  padding:15px;
  background:#0b5b74;
  color:white;
  border:none;
  cursor:pointer;
  font-size:18px;
}
</style>
</head>

<body>

<input id="memberInput" placeholder="Enter Member ID">
<button onclick="searchMember()">Search</button>

<div id="card" class="id-card">

  <div class="card-header">
    <h1>अखिल भारतीय नार्मदीय ब्राह्मण समाज महासभा</h1>
    <p>सदस्य पहचान पत्र</p>
  </div>

  <div class="container">

    <div style="flex:2">
      <table>
        <tr><td>आईडी</td><td id="memberId"></td></tr>
        <tr><td>नाम</td><td id="fullName"></td></tr>
        <tr><td>पिता</td><td id="fatherName"></td></tr>
        <tr><td>माता</td><td id="motherName"></td></tr>
        <tr><td>गोत्र</td><td id="gotra"></td></tr>
        <tr><td>शहर</td><td id="nativePlace"></td></tr>
        <tr><td>आयु</td><td id="age"></td></tr>
        <tr><td>व्यवसाय</td><td id="profession"></td></tr>
        <tr><td>ब्लड ग्रुप</td><td id="bloodGroup"></td></tr>
        <tr><td>मोबाइल</td><td id="contact1"></td></tr>
      </table>
    </div>

    <div class="photo">
      <img id="profilePhoto"
           src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
    </div>

  </div>

  <button class="download" onclick="downloadPDF()">
    Download PDF
  </button>

</div>

<script>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzys__NmfEcakZK_g3DXragH0NCAJi6t8wNWkwKe_bA-DkxaVN58oUkKSXjs7yLyIJH/exec";

/* ================= SEARCH ================= */
async function searchMember(){

  const id = document.getElementById("memberInput").value.trim();
  if(!id){ alert("Enter ID"); return; }

  document.getElementById("card").style.display="none";

  try{

    const res = await fetch(SCRIPT_URL + "?memberId=" + encodeURIComponent(id));
    const text = await res.text();

    const result = JSON.parse(text);

    if(result.status !== "success"){
      alert("Not found");
      return;
    }

    const d = result.data;

    document.getElementById("card").style.display="block";

    document.getElementById("memberId").innerText = d.memberId || "";
    document.getElementById("fullName").innerText = d.fullName || "";
    document.getElementById("fatherName").innerText = d.fatherName || "";
    document.getElementById("motherName").innerText = d.motherName || "";
    document.getElementById("gotra").innerText = d.gotra || "";
    document.getElementById("nativePlace").innerText = d.nativePlace || "";
    document.getElementById("age").innerText = d.age || "";
    document.getElementById("profession").innerText = d.profession || "";
    document.getElementById("bloodGroup").innerText = d.bloodGroup || "";
    document.getElementById("contact1").innerText = d.contact1 || "";

    /* ================= FIX IMAGE ================= */
    const img = document.getElementById("profilePhoto");
console.log("PHOTO:", d);
    if(d.photo && d.photo.includes("http")){
	console.log("PHOTO:", d.photo);
      img.src = d.photo;
    } else {
      img.src = "https://cdn-icons-png.flaticon.com/512/149/149071.png";
    }

  }catch(err){
    console.log(err);
    alert("CORS / Server error");
  }
}

/* ================= PDF ================= */
async function downloadPDF(){

  const card = document.getElementById("card");

  const canvas = await html2canvas(card,{
    scale:2,
    useCORS:true
  });

  const { jsPDF } = window.jspdf;

  const pdf = new jsPDF("p","mm","a4");

  const width = 210;
  const height = (canvas.height * width)/canvas.width;

  pdf.addImage(canvas.toDataURL("image/png"),"PNG",0,0,width,height);

  pdf.save("ID_Card.pdf");
}

</script>

</body>
</html>
