<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>समाज पहचान पत्र</title>

<!-- PDF LIBRARIES -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  background:#e8e8e8;
  padding:20px;
  text-align:center;
  font-family:Arial;
}

/* ================= SEARCH BOX ================= */
#searchBox{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  margin-bottom:10px;
}

input{
  padding:12px;
  width:350px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:16px;
  max-width:90%;
}

button{
  padding:12px 20px;
  background:#0b5b74;
  color:white;
  border:none;
  cursor:pointer;
  border-radius:8px;
  font-size:16px;
}

/* ================= CARD ================= */
.id-card{
  max-width:1100px;
  margin:auto;
  background:white;
  border:4px solid #111;
  display:none;
  border-radius:18px;
  overflow:hidden;
  margin-top:20px;
}

/* HEADER — title on the left, photo pinned to the right corner
   at every screen size */
.card-header{
  background:linear-gradient(135deg,#0d5d73,#2b8aa0,#5aa7b5);
  color:white;
  text-align:center;
  padding:22px 20px;
}

.card-header h1{
  font-size:24px;
  margin-bottom:6px;
  line-height:1.3;
}
.card-header p{
  font-size:16px;
}

/* PHOTO — sits beside the table, always on the right, never
   drops below it even on narrow screens (flex-wrap: nowrap on
   .container is what prevents the stacking) */
.photo{
  flex-shrink:0;
  width:140px;
}
.photo img{
  width:100%;
  height:170px;
  object-fit:cover;
  border:3px solid #111;
  border-radius:10px;
  background:white;
  display:block;
}

/* BODY */
.container{
  display:flex;
  flex-wrap:nowrap;
  align-items:flex-start;
  gap:15px;
  padding:20px;
}
.left{
  flex:1;
  min-width:0;
}
table{
  width:100%;
  border-collapse:collapse;
}
td{
  border:2px solid #111;
  padding:8px;
  font-size:18px;
  text-align:left;
}
td:first-child{
  width:35%;
  font-weight:bold;
  background:#f2f2f2;
}

/* DOWNLOAD BUTTON */
.download{
  width:100%;
  padding:14px;
  background:#0b5b74;
  color:white;
  border:none;
  font-size:20px;
  cursor:pointer;
  border-radius:0;
}

/* STATUS */
.status{
  margin:15px;
  font-size:16px;
  color:#333;
}

/* ================= RESPONSIVE ================= */
@media (max-width: 768px) {
  .card-header{
    padding:16px 15px;
  }
  .container{
    gap:10px;
    padding:14px;
  }
  .photo{
    width:95px;
  }
  .photo img{
    height:115px;
  }
  table td { font-size:15px; padding:6px; }
  .card-header h1 { font-size:19px; margin-bottom:4px; }
  .card-header p { font-size:14px; }
  input{ width:100%; }
}
@media (max-width: 480px) {
  .container{
    gap:6px;
    padding:10px;
  }
  .photo{
    width:70px;
  }
  .photo img{
    height:85px;
    border-width:2px;
  }
  table td { font-size:12px; padding:4px; }
  .card-header h1 { font-size:16px; }
  .card-header p { font-size:12px; }
}
</style>
</head>

<body>

<div id="searchBox">
  <input id="memberInput" placeholder="Enter Member ID">
  <button onclick="searchMember()">Search</button>
</div>

<div class="status" id="status"></div>

<!-- ================= ID CARD ================= -->
<div class="id-card" id="card">
  <!-- HEADER -->
  <div class="card-header">
    <h1>अखिल भारतीय नार्मदीय ब्राह्मण समाज महासभा</h1>
    <p>सदस्य पहचान पत्र</p>
  </div>

  <!-- BODY (table on the left, photo on the right, side by side) -->
  <div class="container">
    <div class="left">
      <table>
        <tr><td>आईडी</td><td id="memberId"></td></tr>
        <tr><td>नाम</td><td id="fullName"></td></tr>
        <tr><td>पिता</td><td id="fatherName"></td></tr>
        <tr><td>माता</td><td id="motherName"></td></tr>
        <tr><td>गोत्र</td><td id="gotra"></td></tr>
        <tr><td>शहर</td><td id="nativePlace"></td></tr>
      <tr><td>आयु</td><td id="age"></td></tr>
      <tr><td>व्यवसाय</td><td id="profession"></td></tr>
      <tr><td>ब्लड ग्रुप</td><td id="bloodGroup"></td></tr>
      <tr><td>मोबाइल</td><td id="contact1"></td></tr>
      <tr><td>आधार नंबर</td><td id="aadhaarNumber"></td></tr>
      </table>
    </div>

    <div class="photo">
      <img id="profilePhoto" alt="Member Photo">
    </div>
  </div>

  <!-- DOWNLOAD BUTTON -->
  <button class="download" onclick="downloadPDF()">Download PDF</button>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxzuNAnPCskNUWVVFw9ZGUZuMhEFtLPV_hF1DNKE-xjgr1EScyPzUKgarRSqfcsfvv9/exec";

/* ================= SHOW / HIDE SEARCH UI ================= */
function showCardUI(){
  document.getElementById("card").style.display = "block";
  document.getElementById("searchBox").style.display = "none";
}

/* ================= SEARCH MEMBER ================= */
async function searchMember(silent = false){
  const id = document.getElementById("memberInput").value.trim();
  if(!id){ if(!silent) alert("Enter Member ID"); return false; }
  if(!silent) document.getElementById("status").innerText = "Loading...";

  try{
    const response = await fetch(SCRIPT_URL + "?memberId=" + encodeURIComponent(id));
    const text = await response.text();
    const result = JSON.parse(text);

    if(result.status !== "success"){
      if(!silent){
        document.getElementById("status").innerText = "Member not found";
        alert("Member not found");
      }
      return false;
    }

    const d = result.data;
    showCardUI();
    document.getElementById("status").innerText = "";

    /* SET VALUES */
    document.getElementById("memberId").innerText = d.memberId || "";
    document.getElementById("fullName").innerText = d.fullName || "";
    document.getElementById("fatherName").innerText = d.fatherName || "";
    document.getElementById("motherName").innerText = d.motherName || "";
    document.getElementById("gotra").innerText = d.gotra || "";
    document.getElementById("nativePlace").innerText = d.nativePlace || "";
    document.getElementById("age").innerText = d.age || "";
    document.getElementById("profession").innerText = d.profession || "";
    document.getElementById("bloodGroup").innerText = d.bloodGroup || "";
    document.getElementById("contact1").innerText = d.contact1 || "";
    document.getElementById("aadhaarNumber").innerText = formatAadhaar(d.aadhaarNumber);

    /* PHOTO */
    const img = document.getElementById("profilePhoto");
    if(d.photo){
      let fileId = "";
      const match = d.photo.match(/[-\w]{25,}/);
      if(match){ fileId = match[0]; }
      if(fileId){
        img.src = "https://lh3.googleusercontent.com/d/" + fileId;
      } else {
        img.src = d.photo;
      }
    } else {
      img.src = "https://cdn-icons-png.flaticon.com/512/149/149071.png";
    }

    return true;
  }catch(err){
    console.error(err);
    if(!silent){
      document.getElementById("status").innerText = "Error loading data";
      alert("Network / Apps Script Error");
    }
    return false;
  }
}

/* Aadhaar formatting: ensure 12 digits */
function formatAadhaar(num){
  if(!num) return "";
  let str = String(num).replace(/\D/g,"");
  if(str.length === 12){
    return str.replace(/(\d{4})(\d{4})(\d{4})/, "$1-$2-$3");
  }
  return str;
}

/* ================= DOWNLOAD PDF ================= */
async function downloadPDF(){
  const card = document.getElementById("card");
  const images = card.getElementsByTagName("img");
  for(let img of images){
    if(!img.complete){
      await new Promise(resolve => {
        img.onload = resolve;
        img.onerror = resolve;
      });
    }
  }
 const canvas = await html2canvas(card,{ scale:2, useCORS:true });
  const imgData = canvas.toDataURL("image/png");

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF("p","mm","a4");   // ✅ fixed initializer

  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();

  // Scale the card to fit the page
  const ratio = Math.min(pageWidth / canvas.width, pageHeight / canvas.height);
  const imgWidth = canvas.width * ratio;
  const imgHeight = canvas.height * ratio;

  pdf.addImage(imgData, "PNG", 0, 0, imgWidth, imgHeight);
  pdf.save("Samaj_ID_Card.pdf");
}

/* ================= AUTO-LOAD FROM REGISTRATION REDIRECT ================= */
window.addEventListener("DOMContentLoaded", async function(){

    const params = new URLSearchParams(window.location.search);
    const memberId = params.get("memberId");

    if(memberId){

        document.getElementById("memberInput").value = memberId;

        // A member coming straight from registration may not be
        // readable from the sheet on the very first attempt, so retry
        // a few times before showing "not found" to the user.
        const maxAttempts = 6;
        const delayMs = 1500;
        let found = false;

        for(let attempt = 1; attempt <= maxAttempts; attempt++){

            document.getElementById("status").innerText =
                "डेटा लोड हो रहा है... (" + attempt + "/" + maxAttempts + ")";

            found = await searchMember(true); // silent: no alert on a miss

            if(found) break;

            if(attempt < maxAttempts){
                await new Promise(resolve => setTimeout(resolve, delayMs));
            }
        }

        if(!found){
            document.getElementById("status").innerText =
                "Member ID अभी नहीं मिला — कृपया कुछ सेकंड बाद ऊपर 'Search' बटन दबाएँ।";
        }
    }

});

</script>

</body>
</html>
